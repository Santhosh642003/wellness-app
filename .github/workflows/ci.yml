name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wellness_test
          POSTGRES_PASSWORD: wellness_test
          POSTGRES_DB: wellness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            admin/package-lock.json

      # ── Install ────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      # ── Builds ─────────────────────────────────────────────────────────────
      # A broken JSX import, missing component, or invalid syntax causes Vite
      # to exit non-zero here — this step alone would have caught the
      # BiWeeklyQuiz JSX bug before it reached production.
      - name: Build frontend
        run: npm run build

      - name: Build admin
        run: npm run build
        working-directory: admin

      # ── Backend tests (real Postgres) ──────────────────────────────────────
      # The test script in package.json injects DATABASE_URL, JWT_SECRET,
      # ADMIN_JWT_SECRET, and NODE_ENV inline. DB_SSL=false is added here to
      # prevent db.js from auto-enabling SSL for the local service container.
      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          DB_SSL: 'false'

      # ── Security audit (informational — never fails the build) ─────────────
      - name: Audit frontend
        run: npm audit || true

      - name: Audit backend
        run: npm audit || true
        working-directory: backend

      - name: Audit admin
        run: npm audit || true
        working-directory: admin
